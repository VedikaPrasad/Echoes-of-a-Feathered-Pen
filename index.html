    let currentIdx = 0;
    const p1 = document.getElementById('page1');
    const p2 = document.getElementById('page2');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counter = document.getElementById('pageCounter');

    function fillCardContent(element, index) {
      if (index < 0 || index >= poemsList.length) return;
      element.innerHTML = `
        <h2 class="poem-title">${poemsList[index].title}</h2>
        <div class="poem-content">${poemsList[index].text}</div>
      `;
    }

    function syncInterfaceView(isNextAction) {
      counter.textContent = `Poem ${currentIdx + 1} of ${poemsList.length}`;
      prevBtn.disabled = currentIdx === 0;
      nextBtn.disabled = currentIdx === poemsList.length - 1;

      const activeCard = currentIdx % 2 === 0 ? p1 : p2;
      const hiddenCard = currentIdx % 2 === 0 ? p2 : p1;

      fillCardContent(activeCard, currentIdx);

      if (isNextAction !== undefined) {
        if (isNextAction) {
          hiddenCard.classList.add('flipped');
          hiddenCard.classList.remove('active');
          activeCard.classList.remove('flipped');
          activeCard.classList.add('active');
        } else {
          hiddenCard.classList.remove('flipped', 'active');
          activeCard.classList.remove('flipped');
          activeCard.classList.add('active');
        }
      } else {
        activeCard.classList.add('active');
        activeCard.classList.remove('flipped');
        hiddenCard.classList.remove('active', 'flipped');
      }
    }

    nextBtn.addEventListener('click', () => {
      if (currentIdx < poemsList.length - 1) {
        currentIdx++;
        syncInterfaceView(true);
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentIdx > 0) {
        currentIdx--;
        syncInterfaceView(false);
      }
    });

    syncInterfaceView();
